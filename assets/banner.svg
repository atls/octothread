<svg width="1600" height="840" viewBox="0 0 1600 840" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="140" y1="76" x2="1428" y2="808" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091122"/>
      <stop offset="0.45" stop-color="#111B34"/>
      <stop offset="1" stop-color="#1D2852"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(238 172) rotate(90) scale(210 270)">
      <stop stop-color="#78F0FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#78F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 180) rotate(90) scale(260 340)">
      <stop stop-color="#5865F2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1332 650) rotate(90) scale(220 260)">
      <stop stop-color="#FF7B57" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF7B57" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" stroke="white" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="card" x1="1134" y1="138" x2="1134" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(19, 27, 52, 0.82)"/>
      <stop offset="1" stop-color="rgba(10, 17, 36, 0.94)"/>
    </linearGradient>
    <linearGradient id="trace" x1="944" y1="418" x2="1288" y2="418" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7B57" stop-opacity="0.12"/>
      <stop offset="0.23" stop-color="#78F0FF"/>
      <stop offset="0.74" stop-color="#5865F2"/>
      <stop offset="1" stop-color="#5865F2" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="logoCardLight" x1="894" y1="300" x2="1110" y2="538" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="logoCardBlurple" x1="1150" y1="300" x2="1360" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6A76FF"/>
      <stop offset="1" stop-color="#3F4CD0"/>
    </linearGradient>
    <linearGradient id="badgeFill" x1="94" y1="80" x2="314" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1A36" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0C1530" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="blur" x="-120" y="-120" width="1840" height="1080" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="742" y="74" width="784" height="666" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="30"/>
      <feGaussianBlur stdDeviation="36"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.0156863 0 0 0 0 0.027451 0 0 0 0 0.0784314 0 0 0 0.55 0"/>
      <feBlend in2="SourceGraphic" result="shape"/>
    </filter>
    <filter id="softShadow" x="0" y="0" width="1600" height="840" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="14"/>
      <feGaussianBlur stdDeviation="18"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.0156863 0 0 0 0 0.027451 0 0 0 0 0.0784314 0 0 0 0.32 0"/>
      <feBlend in2="SourceGraphic" result="shape"/>
    </filter>
    <clipPath id="atlsClip">
      <rect x="814" y="306" width="224" height="224" rx="38"/>
    </clipPath>
  </defs>

  <rect width="1600" height="840" fill="url(#bg)"/>
  <rect width="1600" height="840" fill="url(#grid)"/>
  <g filter="url(#blur)">
    <ellipse cx="238" cy="172" rx="210" ry="270" fill="url(#glowA)"/>
    <ellipse cx="1180" cy="180" rx="260" ry="340" fill="url(#glowB)"/>
    <ellipse cx="1332" cy="650" rx="220" ry="260" fill="url(#glowC)"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="82" y="74" width="256" height="44" rx="22" fill="url(#badgeFill)" stroke="white" stroke-opacity="0.12"/>
  </g>
  <circle cx="110" cy="96" r="6" fill="#78F0FF"/>
  <text x="128" y="101" fill="#EEF3FF" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">ATLS x DISCORD</text>

  <text x="82" y="252" fill="#F5F7FF" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-4.4">
    <tspan x="82" dy="0">Turn GitHub noise</tspan>
    <tspan x="82" dy="92">into focused</tspan>
    <tspan x="82" dy="92" fill="#78F0FF">Discord threads</tspan>
  </text>
  <text x="86" y="548" fill="#D5DCFF" fill-opacity="0.78" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="500">
    <tspan x="86" dy="0">Octothread keeps the channel clean: one root message per</tspan>
    <tspan x="86" dy="42">issue or pull request, every follow-up routed into the right</tspan>
    <tspan x="86" dy="42">thread, zero webhook spam in the main feed</tspan>
  </text>

  <g filter="url(#softShadow)">
    <rect x="86" y="650" width="232" height="50" rx="18" fill="#121C36" fill-opacity="0.72" stroke="white" stroke-opacity="0.08"/>
    <rect x="334" y="650" width="230" height="50" rx="18" fill="#121C36" fill-opacity="0.72" stroke="white" stroke-opacity="0.08"/>
    <rect x="580" y="650" width="188" height="50" rx="18" fill="#121C36" fill-opacity="0.72" stroke="white" stroke-opacity="0.08"/>
  </g>
  <text x="112" y="682" fill="#F2F5FF" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Issue to thread mapping</text>
  <text x="364" y="682" fill="#F2F5FF" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">PR reviews in context</text>
  <text x="607" y="682" fill="#F2F5FF" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Delivery dedupe</text>

  <g filter="url(#shadow)">
    <rect x="774" y="124" width="720" height="572" rx="34" fill="#101B35" fill-opacity="0.84" stroke="white" stroke-opacity="0.1"/>
  </g>
  <path d="M916 418H1260" stroke="url(#trace)" stroke-width="10" stroke-linecap="round"/>
  <path d="M1260 418V354H1364" stroke="#8EA0FF" stroke-width="10" stroke-linecap="round"/>
  <circle cx="998" cy="418" r="17" fill="#EEF2FF"/>
  <circle cx="1250" cy="418" r="17" fill="#EEF2FF"/>

  <rect x="814" y="306" width="224" height="224" rx="38" fill="url(#logoCardLight)" stroke="white" stroke-opacity="0.12"/>
  <g clip-path="url(#atlsClip)">
    <image href="atls-avatar.png" x="832" y="324" width="188" height="188" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <rect x="1268" y="306" width="224" height="224" rx="38" fill="url(#logoCardBlurple)" stroke="white" stroke-opacity="0.12"/>
  <image href="discord-symbol.svg" x="1310" y="364" width="140" height="104" preserveAspectRatio="xMidYMid meet"/>

  <g filter="url(#softShadow)">
    <rect x="1226" y="178" width="196" height="66" rx="20" fill="#0E162C" fill-opacity="0.92" stroke="white" stroke-opacity="0.08"/>
    <rect x="952" y="560" width="216" height="66" rx="20" fill="#0E162C" fill-opacity="0.92" stroke="white" stroke-opacity="0.08"/>
    <rect x="1184" y="262" width="248" height="52" rx="18" fill="#5865F2" fill-opacity="0.16" stroke="#8EA0FF" stroke-opacity="0.3"/>
  </g>
  <text x="1252" y="206" fill="#F2F5FF" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">thread created</text>
  <text x="1252" y="227" fill="#D5DCFF" fill-opacity="0.72" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">#194 pull_request opened</text>

  <text x="978" y="588" fill="#F2F5FF" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">root message</text>
  <text x="978" y="609" fill="#D5DCFF" fill-opacity="0.72" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">monorepo / #octothread</text>

  <text x="1212" y="294" fill="#EEF3FF" fill-opacity="0.92" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0.4">live sync into Discord threads</text>
</svg>
